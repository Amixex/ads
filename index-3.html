<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ОГЭ для Лизы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: одна мягкая колонка, карточки на пастельном фоне, сердечки плывут позади */
:root{
  --bg:#fff4f8; --bg2:#ffe3ee; --card:#ffffff; --ink:#4b2a3c; --muted:#85596f;
  --pink:#e23f86; --pink-soft:#ffd6e6; --lilac:#8e63e6; --lilac-soft:#ebe2ff;
  --peach:#ff9c6b; --peach-soft:#ffe5d6; --good:#1f8f5a; --good-soft:#d9f5e7;
  --bad:#b4415f; --bad-soft:#ffe0e8; --line:#f5cadc; --shadow:rgba(226,63,134,.16);
  --btn:#d63384; --btn2:#8e63e6; --on-btn:#ffffff;
  --display:'Comfortaa','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241420; --bg2:#33192c; --card:#3a2233; --ink:#ffeaf3; --muted:#d8aec2;
    --pink:#ff7bb0; --pink-soft:#5b2945; --lilac:#bba3ff; --lilac-soft:#3f3263;
    --peach:#ffb38c; --peach-soft:#59372a; --good:#6fe0a6; --good-soft:#1f4a38;
    --bad:#ff8fae; --bad-soft:#5a2536; --line:#573049; --shadow:rgba(0,0,0,.4);
    --btn:#d9468f; --btn2:#7c56d8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241420; --bg2:#33192c; --card:#3a2233; --ink:#ffeaf3; --muted:#d8aec2;
  --pink:#ff7bb0; --pink-soft:#5b2945; --lilac:#bba3ff; --lilac-soft:#3f3263;
  --peach:#ffb38c; --peach-soft:#59372a; --good:#6fe0a6; --good-soft:#1f4a38;
  --bad:#ff8fae; --bad-soft:#5a2536; --line:#573049; --shadow:rgba(0,0,0,.4);
  --btn:#d9468f; --btn2:#7c56d8; color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background-color:var(--bg);
  background-image:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--body);
  font-size:16.5px;
  line-height:1.55;
  padding-block:18px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:3px;border-radius:10px}

#hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#hearts span{position:absolute;bottom:-50px;opacity:0;animation:floatUp linear infinite}
@keyframes floatUp{
  0%{transform:translate(0,0) rotate(0deg);opacity:0}
  10%{opacity:.55}
  50%{transform:translate(22px,-58vh) rotate(14deg)}
  90%{opacity:.55}
  100%{transform:translate(-14px,-118vh) rotate(-10deg);opacity:0}
}
.app{position:relative;z-index:1;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.app>*{min-width:0;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.app>*:nth-child(2){animation-delay:.05s}.app>*:nth-child(3){animation-delay:.1s}
.app>*:nth-child(4){animation-delay:.15s}.app>*:nth-child(5){animation-delay:.2s}
.app>*:nth-child(6){animation-delay:.25s}

.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px 18px 20px;box-shadow:0 10px 26px var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:1.08rem}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}

/* hero */
.hero{position:relative;text-align:center;padding:30px 18px 26px;border-radius:32px;border:2px solid var(--line);background:linear-gradient(135deg,var(--pink-soft),var(--lilac-soft) 60%,var(--peach-soft));box-shadow:0 14px 34px var(--shadow);overflow:hidden}
.hero h1{font-size:clamp(1.9rem,8vw,2.7rem);font-weight:700;background:linear-gradient(90deg,var(--pink),var(--lilac),var(--peach),var(--pink));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.hero p{margin-top:8px;color:var(--ink);font-weight:700}
.hero .deco{position:absolute;font-size:1.6rem;animation:bob 4s ease-in-out infinite}
.hero .d1{left:14px;top:12px}.hero .d2{right:16px;top:20px;animation-delay:-1.2s}
.hero .d3{left:22px;bottom:12px;animation-delay:-2.4s}.hero .d4{right:24px;bottom:14px;animation-delay:-.6s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-9px) rotate(6deg)}}
.beat{display:inline-block;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;font:800 1rem var(--body);color:var(--on-btn);background:linear-gradient(120deg,var(--btn),var(--btn2));padding:13px 20px;border-radius:999px;box-shadow:0 8px 18px var(--shadow);min-height:48px;transition:transform .15s ease;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px) scale(1.02)}
.btn:active{transform:scale(.97)}
.btn.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 18px var(--shadow),0 0 0 0 rgba(226,63,134,.45)}50%{box-shadow:0 8px 18px var(--shadow),0 0 0 12px rgba(226,63,134,0)}}
.btn.soft{background:var(--pink-soft);color:var(--ink);box-shadow:none}
.btn.line{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* support */
.support{background:linear-gradient(135deg,var(--lilac-soft),var(--pink-soft));text-align:center;align-items:center;gap:14px}
.support .phrase{font-family:var(--display);font-weight:700;font-size:1.28rem;min-height:3.2em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.phrase.swap{animation:pop .5s ease}
@keyframes pop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:none}}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.big-num{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1;color:var(--pink)}
.bar{height:16px;border-radius:999px;background:var(--pink-soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--lilac),var(--peach));background-size:200% 100%;animation:slide 3s linear infinite;transition:width .8s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{to{background-position:200% 0}}
.bar.thin{height:10px}
input[type=date]{font:700 1rem var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:46px;max-width:100%}

/* subject cards */
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:480px){.subjects{grid-template-columns:1fr}}
.subj{text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 26px var(--shadow);transition:transform .2s ease}
.subj:hover{transform:translateY(-4px) rotate(-.6deg)}
.subj .em{font-size:2.3rem;line-height:1}
.subj h3{font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{appearance:none;cursor:pointer;font:700 .95rem var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:9px 14px;min-height:44px;display:inline-flex;gap:8px;align-items:center;transition:transform .15s ease}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--pink)}
.chip small{font-weight:700;color:var(--muted)}
.soon{font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--lilac-soft);color:var(--ink);border-radius:999px;padding:2px 8px}

/* stickers */
.stickers{display:flex;flex-wrap:wrap;gap:10px}
.sticker{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:1.9rem;background:var(--peach-soft);border:2px dashed var(--line)}
.sticker.on{background:var(--pink-soft);border-style:solid;animation:wiggle 3s ease-in-out infinite}
.sticker.off{filter:grayscale(1);opacity:.5;font-size:1.3rem}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-8deg)}96%{transform:rotate(8deg)}}

/* timer */
.timer-num{font-family:var(--display);font-weight:700;font-size:3.2rem;text-align:center;letter-spacing:.04em;font-variant-numeric:tabular-nums}

/* back + topic head */
.back{display:inline-flex;align-self:flex-start;text-decoration:none;font-weight:800;color:var(--pink);padding:8px 12px 8px 4px;min-height:44px;align-items:center}
.thead{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.thead .big{font-size:2.6rem;line-height:1;animation:bob 4s ease-in-out infinite;align-self:flex-start}
.thead h2{font-size:1.65rem}
.topic-list{display:flex;flex-direction:column;gap:12px}
.topic-row{display:flex;gap:14px;align-items:center;text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:0 8px 20px var(--shadow);transition:transform .2s ease;min-width:0}
.topic-row:hover{transform:translateX(4px)}
.topic-row .em{font-size:1.8rem;flex:none}
.topic-row .tx{flex:1;min-width:0}
.topic-row b{display:block;font-family:var(--display);font-size:1.02rem}
.topic-row span.s{color:var(--muted);font-size:.92rem}
.tick{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-weight:800;color:transparent}
.tick.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}

.facts{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.rule{background:var(--lilac-soft);border-color:transparent}
.rule p+p,.rule ul{margin-top:6px}
.rule ul{margin:6px 0 0;padding-left:1.2em}
.formula{font-family:var(--display);font-weight:700;font-size:1.12rem;background:var(--card);border-radius:16px;padding:10px 14px;text-align:center;margin-top:6px;overflow-wrap:anywhere}
.ex{background:var(--bg);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ex .q{font-weight:800;font-size:1.05rem;overflow-wrap:anywhere}
.ex ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:5px}
.ex ol li::marker{color:var(--pink);font-weight:800}
details.ans{background:var(--bg);border-radius:18px;padding:12px 14px}
details.ans summary{cursor:pointer;list-style:none;font-weight:800;display:flex;gap:10px;align-items:center;min-height:36px}
details.ans summary::-webkit-details-marker{display:none}
details.ans summary::after{content:"Показать ответ";margin-left:auto;font-size:.85rem;color:var(--on-btn);background:linear-gradient(120deg,var(--btn),var(--btn2));padding:6px 12px;border-radius:999px;white-space:nowrap}
details.ans[open] summary::after{content:"Скрыть"}
details.ans .a{margin-top:8px;color:var(--good);font-weight:800;overflow-wrap:anywhere}
.warn{background:var(--peach-soft);border-color:transparent}
.hack{background:var(--good-soft);border-color:transparent}
.warn ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}

/* quiz */
.qtext{font-weight:800;font-size:1.1rem;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{appearance:none;cursor:pointer;text-align:left;font:700 1rem var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-height:48px;transition:transform .15s ease}
.opt:hover:not([disabled]){transform:translateX(3px);border-color:var(--pink)}
.opt.ok{background:var(--good-soft);border-color:var(--good);animation:pop .4s ease}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{font-weight:800;padding:10px 12px;border-radius:14px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.score{font-family:var(--display);font-size:2.6rem;font-weight:700;color:var(--pink)}
.qstep{font-size:.85rem;font-weight:800;color:var(--muted)}
.done-btn{align-self:stretch}

.msg-card{background:linear-gradient(135deg,var(--peach-soft),var(--pink-soft));text-align:center;align-items:center}
.msg-text{white-space:pre-line;font-weight:700;animation:pop .6s ease}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;pointer-events:none;z-index:60;background:var(--card);color:var(--ink);border:2px solid var(--pink);border-radius:22px;padding:12px 18px;box-shadow:0 14px 34px var(--shadow);max-width:min(92vw,420px);width:max-content;text-align:center;font-weight:800;transition:opacity .35s ease,transform .35s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .st{font-size:2.4rem;display:block;line-height:1.1}
.puff{position:fixed;pointer-events:none;z-index:70;font-size:20px}
.foot{text-align:center;color:var(--muted);font-size:.88rem;padding:4px 0}

a.chip{text-decoration:none}
.flashcard{appearance:none;cursor:pointer;border:2px solid var(--line);border-radius:28px;min-height:230px;width:100%;padding:24px 20px;background:linear-gradient(135deg,var(--pink-soft),var(--lilac-soft));color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;box-shadow:0 10px 26px var(--shadow);transition:transform .2s ease}
.flashcard:hover{transform:translateY(-3px)}
.flashcard.flipped{background:linear-gradient(135deg,var(--peach-soft),var(--pink-soft))}
.fc-tag{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}
.fc-text{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.35;overflow-wrap:anywhere;animation:pop .35s ease}
.fc-hint{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .hero h1{-webkit-text-fill-color:currentColor;color:var(--pink);background:none}
}
</style>
</head>

    (EXTRA[s.id]||[]).forEach((q,i)=>out.push({id:"x-"+s.id+"-"+i,q:q.q,o:q.o,a:q.a,tag:s.name}));
  });
  return out;
}
function wordQs(){ return WORDS.map((w,i)=>({id:"w-"+i,q:"Вставь букву: "+w[0],o:w[1],a:w[2],full:w[3],tag:"Словарные слова"})); }
function makeSession(key){
  let title="Тренировка", qs=[];
  if(key==="t-math"||key==="t-russian"){
    const sid=key.slice(2), s=SUBJECTS.find(x=>x.id===sid);
    if(s){ title="Пробный вариант: "+s.name; qs=shuffle(bank(sid)).slice(0,15); }
  }
  else if(key==="t-blitz"){ title="Блиц ⚡"; qs=shuffle(bank()).slice(0,10); }
  else if(key==="t-words"){ title="Словарные слова 🔤"; qs=shuffle(wordQs()).slice(0,12); }
  else if(key==="t-mistakes"){ title="Работа над ошибками 🔁"; const w=getWrong(); qs=shuffle(bank().concat(wordQs()).filter(q=>w.indexOf(q.id)>=0)); }
  return {key,title,qs,i:0,score:0,picked:null,missed:[]};
}
function runInner(){
  const S=session, n=S.qs.length;
  if(S.i>=n){
    const pct=Math.round(S.score/n*100);
    const msg=pct>=90?"Идеально, умничка! 🏆":pct>=70?"Очень хорошо! 💕":pct>=50?"Неплохо! Давай повторим ошибки 🌷":"Ничего страшного, это только начало 🤍 Загляни в «Работу над ошибками»";
    return `<div class="result"><div class="score">${S.score} из ${n}</div><p>${msg}</p></div>
      ${S.missed.length?`<span class="eyebrow">Над чем стоит подумать</span>${S.missed.map(q=>`<div class="ex"><div class="q">${q.q}</div><p class="muted">Верный ответ: <b>${q.full||q.o[q.a]}</b></p></div>`).join("")}`:`<p class="fb ok">Ни одной ошибки! 💖</p>`}
      <div class="row"><button class="btn" data-rretry>Ещё раз</button><a class="btn soft" href="#train">К тренировкам</a></div>`;
  }
  const q=S.qs[S.i], answered=S.picked!==null;
  return `<div class="bar thin"><i style="width:${Math.round(S.i/n*100)}%;animation:none"></i></div>
    <span class="qstep">${q.tag} · вопрос ${S.i+1} из ${n}</span>
    <div class="qtext">${q.q}</div>
    <div class="opts">${q.o.map((o,k)=>{
      let cls="opt"; if(answered){ if(k===q.a) cls+=" ok"; else if(k===S.picked) cls+=" bad"; }
      return `<button class="${cls}" data-ropt="${k}" ${answered?"disabled":""}>${o}</button>`;
    }).join("")}</div>
    ${answered?`<div class="fb ${S.picked===q.a?"ok":"bad"}">${S.picked===q.a?nm(pick(PRAISE)):pick(SOFT)+" Верный ответ: "+(q.full||q.o[q.a])}</div>
      <button class="btn" data-rnext>${S.i+1>=n?"Смотреть результат":"Дальше"}</button>`:""}`;
}
function runHTML(){
  const S=session;
  const head=`<a class="back" href="#train">← Тренировки</a><header class="thead"><h2>${S.title}</h2></header>`;
  if(!S.qs.length) return head+`<section class="card"><p>${S.key==="t-mistakes"?"Ошибок пока нет, ты умница! 💖 Они появятся здесь, если что-то не получится.":"Здесь пока пусто."}</p><a class="btn" href="#train">К тренировкам</a></section>`;
  return head+`<section class="card" id="run">${runInner()}</section>`;
}

/* ---------- анимации ---------- */
function initHearts(){
  if(reduce) return;
  const box=$("hearts"), set=["💗","💖","💕","🤍","✨","🌸"];
  for(let i=0;i<16;i++){
    const s=document.createElement("span");
    s.textContent=set[i%set.length];
    s.style.left=(Math.random()*96)+"%";
    s.style.fontSize=(14+Math.random()*20)+"px";
    s.style.animationDuration=(13+Math.random()*14)+"s";
    s.style.animationDelay=(-Math.random()*24)+"s";
    box.appendChild(s);
  }
}
function burst(x,y,n,set){
  if(reduce) return;
  n=n||8; set=set||["💖","💗","✨","💕","🌸"];
  for(let i=0;i<n;i++){
    const s=document.createElement("span");
    s.className="puff"; s.textContent=pick(set);
    s.style.left=x+"px"; s.style.top=y+"px";
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2, d=40+Math.random()*80;
    const dx=Math.cos(a)*d, dy=Math.sin(a)*d-30;
    const an=s.animate([
      {transform:"translate(-50%,-50%) scale(.4)",opacity:1},
      {transform:"translate(calc(-50% + "+dx+"px), calc(-50% + "+dy+"px)) scale(1.2)",opacity:0}
    ],{duration:900+Math.random()*600,easing:"cubic-bezier(.2,.7,.3,1)"});
    an.onfinish=()=>s.remove();
  }
}
function confettiAt(el){
  const r=el.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,16,["🎉","💖","✨","🌸","🎀","💕"]);
}

const T_TOTAL=600; let tLeft=T_TOTAL, tEnd=0, tRun=false, tInt=null;
const tFmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tPaint(){
  const d=$("tdisp"); if(d) d.textContent=tFmt(Math.max(0,Math.ceil(tLeft)));
  const b=$("tbar"); if(b) b.style.width=((T_TOTAL-tLeft)/T_TOTAL*100)+"%";
  const s=$("tstart"); if(s) s.textContent = tRun?"Пауза":(tLeft<T_TOTAL&&tLeft>0?"Продолжить":"Начать перерыв");
}
function tTick(){
  if(!tRun) return;
  tLeft=(tEnd-Date.now())/1000;
  if(tLeft<=0){
    tLeft=0; tRun=false; clearInterval(tInt);
    toast("Перерыв закончился! Ты отдохнула, можно дальше 💗");
    burst(innerWidth/2,innerHeight/2,16);
  }
  tPaint();
}
function timerAction(a){
  if(a==="start"){
    if(tRun){ tRun=false; clearInterval(tInt); }
    else{
      if(tLeft<=0) tLeft=T_TOTAL;
      tEnd=Date.now()+tLeft*1000; tRun=true; clearInterval(tInt); tInt=setInterval(tTick,250);
    }
  }else{ tRun=false; clearInterval(tInt); tLeft=T_TOTAL; }
  tPaint();
}

  const now=new Date(); now.setHours(0,0,0,0);
  const days=Math.round((d-now)/86400000);

/* ---------- роутинг ---------- */
function findRoute(){
  const h=decodeURIComponent((location.hash||"").replace(/^#/,""));
  if(!h) return {view:"home"};
  if(h==="train") return {view:"train"};
  if(h==="cards") return {view:"cards"};
  if(h==="cheat") return {view:"cheat"};
  if(/^t-/.test(h)) return {view:"run",key:h};
  const s=SUBJECTS.find(x=>x.id===h); if(s) return {view:"subject",s};
  for(const sub of SUBJECTS){ const t=sub.topics.find(x=>x.id===h); if(t) return {view:"topic",s:sub,t}; }
  return {view:"home"};
}
let lastKey="";
function render(scrollTop){
  const r=findRoute(), app=$("app");
  if(r.view!=="run") session=null; else if(!session||session.key!==r.key) session=makeSession(r.key);
  if(r.view!=="cards") cardsS=null; else if(!cardsS) cardsS=makeCards();
  app.innerHTML = viewHTML(r);
  if(r.view==="home"){
    tPaint();
    requestAnimationFrame(()=>{ const b=$("pbar"); if(b){ const total=allTopics().length; b.style.width=(total?Math.round(doneCount()/total*100):0)+"%"; } });
  }
  const key=r.view+(r.t?r.t.id:r.s?r.s.id:(r.key||""));
  if(scrollTop!==false && key!==lastKey) window.scrollTo(0,0);
  lastKey=key;
}
window.addEventListener("hashchange",()=>render());

/* ---------- события ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-support],[data-fav],[data-done],[data-opt],[data-next],[data-retry],[data-timer],[data-msg],[data-ropt],[data-rnext],[data-rretry],[data-flip],[data-know],[data-again],[data-cardsreset],[data-goal]");
  if(!t) return;

  if(t.hasAttribute("data-support")){
    const p=$("phrase"); p.textContent=nextPhrase(); p.classList.remove("swap"); void p.offsetWidth; p.classList.add("swap");
    burst(e.clientX,e.clientY,12);
  }
  else if(t.hasAttribute("data-fav")){
    const id=t.getAttribute("data-fav"); favs[id]=!favs[id]; LS.set("liza_favs",favs); render(false);
  }
  else if(t.hasAttribute("data-done")){
    const id=t.getAttribute("data-done"); const wasDone=!!done[id];
    if(wasDone) delete done[id]; else done[id]=true;
    LS.set("liza_done",done);
    const count=Math.floor(doneCount()/TOPICS_PER_STICKER);
    render(false);
    if(!wasDone){
      burst(e.clientX,e.clientY,14,["🎉","💖","✨","🌸","🎀"]);
      if(count>unlocked){
        const st=STICKERS[(count-1)%STICKERS.length];
        toast(`<span class="st">${st[0]}</span>Новая наградка: ${st[1]}! Ты такая молодец 💖`);
      } else toast("Тема пройдена! Ты умница 💖");
    }
    unlocked=count;
  }
  else if(t.hasAttribute("data-opt")){
    const r=findRoute(); if(r.view!=="topic") return;
    const st=quizState[r.t.id]; if(!st||st.picked!==null) return;
    const k=Number(t.getAttribute("data-opt")); st.picked=k;
    const ok=k===r.t.quiz[st.i].a; if(ok) st.score++;
    recordAnswer(r.t.id+"#"+st.i,ok);
    $("quiz").innerHTML=quizHTML(r.t);
    if(ok){ const b=$("quiz").querySelector(".opt.ok"); if(b) confettiAt(b); }
  }
  else if(t.hasAttribute("data-next")){
    const r=findRoute(); if(r.view!=="topic") return;
    const st=quizState[r.t.id]; st.i++; st.picked=null;
    $("quiz").innerHTML=quizHTML(r.t);
    if(st.i>=r.t.quiz.length && st.score===r.t.quiz.length) burst(innerWidth/2,innerHeight/2,20,["🏆","💖","✨","🎉","🌸"]);
  }
  else if(t.hasAttribute("data-retry")){
    const r=findRoute(); if(r.view!=="topic") return;
    quizState[r.t.id]={i:0,score:0,picked:null}; $("quiz").innerHTML=quizHTML(r.t);
  }
  else if(t.hasAttribute("data-ropt")){
    if(!session||session.picked!==null) return;
    const S=session, q=S.qs[S.i], k=Number(t.getAttribute("data-ropt"));
    S.picked=k; const ok=k===q.a;
    if(ok) S.score++; else S.missed.push(q);
    recordAnswer(q.id,ok);
    $("run").innerHTML=runInner();
    if(ok){ const b=$("run").querySelector(".opt.ok"); if(b) confettiAt(b); }
  }
  else if(t.hasAttribute("data-rnext")){
    if(!session) return;
    session.i++; session.picked=null;
    $("run").innerHTML=runInner();
    if(session.i>=session.qs.length && session.score===session.qs.length) burst(innerWidth/2,innerHeight/2,20,["🏆","💖","✨","🎉","🌸"]);
  }
  else if(t.hasAttribute("data-rretry")){
    const r=findRoute(); session=makeSession(r.key); render(false);
  }
  else if(t.hasAttribute("data-flip")){
    if(!cardsS) return; cardsS.flipped=!cardsS.flipped; $("cardbox").innerHTML=cardInner();
  }
  else if(t.hasAttribute("data-know")){
    if(!cardsS) return; cardsS.deck.shift(); cardsS.known++; cardsS.flipped=false;
    $("cardbox").innerHTML=cardInner();
    burst(e.clientX,e.clientY,8);
  }
  else if(t.hasAttribute("data-again")){
    if(!cardsS) return; cardsS.deck.push(cardsS.deck.shift()); cardsS.flipped=false; $("cardbox").innerHTML=cardInner();
  }
  else if(t.hasAttribute("data-cardsreset")){ cardsS=makeCards(); render(false); }
  else if(t.hasAttribute("data-goal")){
    const i=Number(t.getAttribute("data-goal")), g=getGoals();
    g.c[i]=!g.c[i]; LS.set("liza_goals",g); render(false);
    if(g.c[i]) burst(e.clientX,e.clientY,14,["🎉","💖","✨","🌸"]);
  }
  else if(t.hasAttribute("data-timer")){ timerAction(t.getAttribute("data-timer")); }
  else if(t.hasAttribute("data-msg")){
    msgOpen=!msgOpen;
    $("msgbox").innerHTML = msgOpen?`<p class="msg-text">${MY_MESSAGE}</p>`:"";
    if(msgOpen) burst(e.clientX,e.clientY,16,["💗","💌","💖","✨"]);
  }
});
document.addEventListener("change",e=>{
  if(e.target && e.target.id==="exdate"){
    examDate=e.target.value; LS.set("liza_date",examDate);
    const c=$("cd"); if(c) c.innerHTML=countdownHTML();
  }
});

initHearts();
initStreak();
render();
</script>
